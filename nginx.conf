# Réplica de public/_headers para despliegue en Nginx (Dokploy)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad (en todas las respuestas, incluidas los 404)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self'; frame-src https://www.google.com https://www.googletagmanager.com https://www.instagram.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; base-uri 'self'; form-action 'self' https://wa.me; object-src 'none'; upgrade-insecure-requests" always;

    # Assets con hash: cache inmutable de 1 año
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header no hereda: repetir los de seguridad relevantes
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Imágenes con nombre SEO (sin hash en el archivo)
    location /img/ {
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # URLs canónicas sin barra final: /ortodoncia/ redirige a /ortodoncia
    # (evita que la misma página exista en dos URLs). absolute_redirect off
    # conserva el host original detrás del proxy de Dokploy.
    absolute_redirect off;
    rewrite ^/(.+)/$ /$1 permanent;

    # Inglés: mismo patrón, con su propia página 404
    location /en/ {
        try_files $uri $uri.html $uri/index.html /en/404.html;
    }

    # Astro con build.format 'file': cada página es <ruta>.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
