# Réplica de public/_headers para despliegue en Nginx (Dokploy)
#
# Plantilla: el marcador de hashes de script-src (más abajo, en la línea
# Content-Security-Policy) lo rellena scripts/generate-csp.mjs después de
# `astro build`, con los hashes sha256 reales de cada <script> inline del
# HTML construido. El resultado (nginx.generated.conf) es un artefacto de
# build, no se commitea; este archivo es la fuente versionada.
#
# style-src sí necesita 'unsafe-inline': GSAP anima aplicando propiedades
# CSS directo por JS (element.style.x = ...) en cada frame — eso no es un
# <style> ni un atributo estático del HTML, así que ningún hash lo cubre.
# Quitarlo rompería el sistema de reveals/parallax/contadores del sitio
# entero. El riesgo real es bajo: no hay contenido de usuario en ningún
# punto de la página que pueda inyectarse ahí.
server_tokens off;

# Límite de peticiones por IP: no hay endpoints de escritura, pero un mínimo
# de contención evita que un scraper agresivo o un intento de flood le pegue
# directo al origen (Cloudflare/Traefik ya filtran antes, esto es una capa
# adicional barata). 20 req/s con ráfaga de 40 no lo nota un visitante real.
limit_req_zone $binary_remote_addr zone=jsdental:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sitio estático: nadie sube archivos, un body grande solo puede ser abuso
    client_max_body_size 1m;

    # Nunca listar directorios ni servir archivos ocultos (.git, .env, etc.
    # no deberían llegar a la imagen, pero esto es la última línea de defensa)
    autoindex off;
    location ~ /\. {
        deny all;
        return 404;
    }

    limit_req zone=jsdental burst=40 nodelay;

    # Solo GET/HEAD: sitio estático sin endpoints de escritura, cualquier
    # otro método (POST/PUT/DELETE/TRACE...) no tiene función legítima aquí
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Headers de seguridad (en todas las respuestas, incluidas los 404)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # preload: solo tiene efecto si el dominio se somete a hstspreload.org
    # (paso manual, aparte, y difícil de revertir) — el token en sí es inerte
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Cross-Origin-Opener-Policy: aísla el contexto de la pestaña incluso si
    # algún target="_blank" quedara sin rel=noopener (defensa en profundidad
    # contra reverse tabnabbing); no afecta a los iframes embebidos (Maps,
    # Instagram), que se gobiernan por frame-ancestors/X-Frame-Options
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Sin 'unsafe-inline': cada <script>/<style> inline se autoriza por su
    # hash sha256 exacto (ver scripts/generate-csp.mjs). Si el HTML cambia
    # y el hash no coincide, el navegador bloquea ese bloque en vez de
    # ejecutar cualquier cosa que no sea exactamente lo que se construyó.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__ https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com https://*.google.com https://*.doubleclick.net; font-src 'self'; frame-src 'self' https://www.google.com https://www.googletagmanager.com https://www.instagram.com; connect-src 'self' __CSP_API_ORIGIN__https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.google.com https://*.doubleclick.net; base-uri 'self'; form-action 'self' https://wa.me; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Assets con hash: cache inmutable de 1 año
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header no hereda: repetir los de seguridad relevantes
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Imágenes con nombre SEO (sin hash en el archivo)
    location /img/ {
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Responsible disclosure (RFC 9116)
    location = /.well-known/security.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    # URLs canónicas sin barra final: /ortodoncia/ redirige a /ortodoncia
    # (evita que la misma página exista en dos URLs). absolute_redirect off
    # conserva el host original detrás del proxy de Dokploy.
    absolute_redirect off;
    rewrite ^/(.+)/$ /$1 permanent;

    # Inglés: mismo patrón, con su propia página 404
    location /en/ {
        try_files $uri $uri.html $uri/index.html /en/404.html;
    }

    # Astro con build.format 'file': cada página es <ruta>.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
