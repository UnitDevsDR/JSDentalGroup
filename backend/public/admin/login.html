<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso — JS Dental Group</title>
<link rel="stylesheet" href="/admin/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h1 style="margin-top:0;font-size:1.25rem;">Panel de leads</h1>
      <form id="login-form">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required autocomplete="username" />
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
        <button type="submit" class="primary" style="width:100%;margin-top:1.25rem;">Entrar</button>
        <p class="error" id="error" hidden></p>
      </form>
    </div>
  </div>
  <!-- Llamada directa (no el helper api() de app.js): un 401 aquí significa
       "credenciales incorrectas", no "sesión vencida" — no debe redirigir. -->
  <script src="/admin/login.js"></script>
</body>
</html>
